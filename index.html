div>\n      <div class=\"loop-item\"><b>Mở rộng nội bộ</b><p>Từ pilot sang toàn công ty, công ty con và đơn vị kinh doanh.</p></div>\n      <div class=\"loop-item\"><b>Chuẩn ngành</b><p>Tạo benchmark theo ngành, quy mô và nhóm nhân sự.</p></div>\n    </div>\n  </div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">B. Vòng lặp niềm tin khi bán cho doanh nghiệp</p>\n    <div class=\"ads-grid\">\n      <div class=\"hook-card\"><span class=\"hook-label\">1. Chọn đúng KH mục tiêu</span><p class=\"desc\">Không chạy đại trà. Tập trung 50–100 doanh nghiệp có áp lực giữ người rõ ràng.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">2. Pilot gọn</span><p class=\"desc\">Triển khai quy mô nhỏ, nhanh, ít rủi ro và có ROI cụ thể.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">3. Sản phẩm hóa pilot</span><p class=\"desc\">Mỗi pilot thành công tạo thành case study, báo cáo hiệu quả và playbook.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">4. Mở rộng nội bộ</span><p class=\"desc\">Ưu tiên mở rộng trong khách hàng hiện hữu trước khi săn khách hàng mới.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">5. Benchmark & giới thiệu</span><p class=\"desc\">Dùng dữ liệu thật để tạo báo cáo ngành và thu hút cộng đồng HRD.</p></div>\n    </div>\n  </div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">C. Giai đoạn tăng trưởng — mục tiêu & chỉ số chính</p>\n    <table>\n      <thead><tr><th>Giai đoạn</th><th>Mục tiêu</th><th>Trọng tâm</th><th>Chỉ số chính</th></tr></thead>\n      <tbody>\n        <tr><td data-label=\"Giai đoạn\">0 → 10 doanh nghiệp</td><td data-label=\"Mục tiêu\">Xây bộ máy triển khai</td><td data-label=\"Trọng tâm\">Onboarding, tích hợp nhân sự, bộ truyền thông nội bộ</td><td data-label=\"Chỉ số chính\">Thời gian go-live, tỷ lệ tham gia</td></tr>\n        <tr><td data-label=\"Giai đoạn\">10 → 30 doanh nghiệp</td><td data-label=\"Mục tiêu\">Tích lũy tín hiệu</td><td data-label=\"Trọng tâm\">Chuẩn hóa dữ liệu và học theo từng ngành</td><td data-label=\"Chỉ số chính\">Độ phủ dữ liệu, số case study</td></tr>\n        <tr><td data-label=\"Giai đoạn\">30 → 100 doanh nghiệp</td><td data-label=\"Mục tiêu\">Tạo lớp dự báo</td><td data-label=\"Trọng tâm\">Điểm ổn định nhân sự, cảnh báo rủi ro</td><td data-label=\"Chỉ số chính\">Độ chính xác dự báo, cải thiện giữ chân</td></tr>\n        <tr><td data-label=\"Giai đoạn\">100+ doanh nghiệp</td><td data-label=\"Mục tiêu\">Mở rộng chuẩn ngành</td><td data-label=\"Trọng tâm\">Benchmark ngành, báo cáo thị trường, mở rộng ASEAN</td><td data-label=\"Chỉ số chính\">Doanh thu mở rộng, số benchmark</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"card span-12 dark-card\">\n    <p class=\"card-title\">Điểm nhấn chiến lược</p>\n    <p class=\"quote small\">Pilot không chỉ để bán hàng. Pilot là cách Vrddi tích lũy dữ liệu, bằng chứng, niềm tin và khả năng mở rộng.</p>\n  </div>\n</div>",en:"<div class=\"grid\">\n  <div class=\"card span-12 soft-blue\">\n    <p class=\"card-title\">🔁 Enterprise Growth Loop</p>\n    <p class=\"lead\">Vrddi starts as an employee-retention benefit. At scale, it becomes a data layer that helps enterprises understand, predict and improve workforce stability.</p>\n  </div>\n\n  <div class=\"card span-3 soft-blue\"><p class=\"card-title\">0 → 10 enterprises</p><p class=\"quote small\">Standardize deployment</p><p class=\"desc\">Build the process, materials and metrics for the first pilots.</p></div>\n  <div class=\"card span-3 soft-blue\"><p class=\"card-title\">10 → 30 enterprises</p><p class=\"quote small\">Accumulate data</p><p class=\"desc\">Collect financial-behavior and workforce signals by industry.</p></div>\n  <div class=\"card span-3 soft-blue\"><p class=\"card-title\">30 → 100 enterprises</p><p class=\"quote small\">Predict retention risk</p><p class=\"desc\">Build early-warning models by department, branch and employee group.</p></div>\n  <div class=\"card span-3 soft-blue\"><p class=\"card-title\">100+ enterprises</p><p class=\"quote small\">Create benchmarks</p><p class=\"desc\">Expand into a workforce-intelligence layer for Vietnam and ASEAN.</p></div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">A. Enterprise growth loop</p>\n    <div class=\"loop\">\n      <div class=\"loop-item\"><b>Deploy</b><p>Small pilot: one branch, one department, 200–500 employees.</p></div>\n      <div class=\"loop-item\"><b>Accumulate data</b><p>Participation, payout needs and financial-stress signals.</p></div>\n      <div class=\"loop-item\"><b>Predict risk</b><p>Identify unstable teams, branches or workforce groups.</p></div>\n      <div class=\"loop-item\"><b>Recommend retention actions</b><p>Suggest the right action for the right group at the right time.</p></div>\n      <div class=\"loop-item\"><b>Executive usage</b><p>CEO, HRD and CFO use the dashboard for decisions.</p></div>\n      <div class=\"loop-item\"><b>Expand internally</b><p>Move from pilot to company-wide, subsidiaries and business units.</p></div>\n      <div class=\"loop-item\"><b>Build benchmarks</b><p>Create benchmarks by industry, company size and employee group.</p></div>\n    </div>\n  </div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">B. Enterprise trust growth loop</p>\n    <div class=\"ads-grid\">\n      <div class=\"hook-card\"><span class=\"hook-label\">1. Selective accounts</span><p class=\"desc\">Do not run broad lead generation. Focus on 50–100 enterprises with clear retention pressure.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">2. Lean pilot</span><p class=\"desc\">Start small, fast, low-risk and measurable.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">3. Productize pilot success</span><p class=\"desc\">Turn every successful pilot into a case study, impact report and playbook.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">4. Expand inside accounts</span><p class=\"desc\">Prioritize expansion within existing customers before chasing new logos.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">5. Benchmark & referral</span><p class=\"desc\">Use real data to create industry reports and attract the HRD community.</p></div>\n    </div>\n  </div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">C. Growth stages — goals & key metrics</p>\n    <table>\n      <thead><tr><th>Stage</th><th>Goal</th><th>Focus</th><th>Key metrics</th></tr></thead>\n      <tbody>\n        <tr><td data-label=\"Stage\">0 → 10 enterprises</td><td data-label=\"Goal\">Build the deployment engine</td><td data-label=\"Focus\">Onboarding, HR integration, internal communications</td><td data-label=\"Key metrics\">Go-live time, participation rate</td></tr>\n        <tr><td data-label=\"Stage\">10 → 30 enterprises</td><td data-label=\"Goal\">Accumulate signals</td><td data-label=\"Focus\">Data standardization and industry learning</td><td data-label=\"Key metrics\">Data coverage, case studies</td></tr>\n        <tr><td data-label=\"Stage\">30 → 100 enterprises</td><td data-label=\"Goal\">Create prediction layer</td><td data-label=\"Focus\">Workforce stability score and risk alerts</td><td data-label=\"Key metrics\">Prediction accuracy, retention improvement</td></tr>\n        <tr><td data-label=\"Stage\">100+ enterprises</td><td data-label=\"Goal\">Scale benchmarks</td><td data-label=\"Focus\">Industry benchmarks, market reports, ASEAN expansion</td><td data-label=\"Key metrics\">Expansion revenue, benchmark coverage</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"card span-12 dark-card\">\n    <p class=\"card-title\">Strategic highlight</p>\n    <p class=\"quote small\">A pilot is not just a sales motion. It is how Vrddi compounds data, proof, trust and expansion capability.</p>\n  </div>\n</div>"})},
{render:()=>({vi:"<div class=\"grid\">\n  <div class=\"card span-12 soft-blue\">\n    <p class=\"card-title\">🛡️ Lợi thế cạnh tranh</p>\n    <p class=\"lead\">Lợi thế thật của Vrddi không nằm ở việc có thể làm một ứng dụng tương tự. Lợi thế nằm ở dữ liệu hành vi, niềm tin doanh nghiệp, năng lực triển khai lặp lại và benchmark liên doanh nghiệp.</p>\n  </div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">A. Lớp lợi thế cạnh tranh cần xây</p>\n    <div class=\"ads-grid\">\n      <div class=\"hook-card\"><span class=\"hook-label\">1. Quan hệ doanh nghiệp</span><p class=\"desc\">Niềm tin cấp lãnh đạo, mạng lưới HRD và các hợp đồng đã ký.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">2. Bộ máy triển khai</span><p class=\"desc\">Tích hợp HR, playbook theo ngành, bộ truyền thông và quy trình go-live.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">3. Dữ liệu hành vi</span><p class=\"desc\">Tín hiệu tham gia, nhận tiền, áp lực tài chính và tương quan với nghỉ việc.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">4. Lớp phân tích</span><p class=\"desc\">Điểm ổn định nhân sự, phân nhóm rủi ro và khuyến nghị giữ chân.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">5. Benchmark liên doanh nghiệp</span><p class=\"desc\">So sánh theo ngành, quy mô, thâm niên và nhóm lao động.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">6. Khả năng mở rộng ASEAN</span><p class=\"desc\">Mô hình vào thị trường có thể nhân rộng từ Việt Nam sang khu vực.</p></div>\n    </div>\n  </div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">B. Cách xây lợi thế dữ liệu</p>\n    <div class=\"loop\">\n      <div class=\"loop-item\"><b>Chuẩn hóa dữ liệu</b><p>Định nghĩa trường dữ liệu tối thiểu cho mọi khách hàng.</p></div>\n      <div class=\"loop-item\"><b>Xây thư viện tín hiệu</b><p>Tín hiệu theo ngành: bán lẻ, ngân hàng, BPO, y tế.</p></div>\n      <div class=\"loop-item\"><b>So sánh liên doanh nghiệp</b><p>Tạo benchmark khi có từ 10+ doanh nghiệp.</p></div>\n      <div class=\"loop-item\"><b>Dự báo</b><p>Xây điểm ổn định theo nhân viên, đội nhóm, chi nhánh.</p></div>\n      <div class=\"loop-item\"><b>Trí tuệ Việt Nam</b><p>Ấn Độ là hệ thống ghi nhận; Việt Nam xây lớp phân tích.</p></div>\n    </div>\n  </div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">C. Vì sao đối thủ khó sao chép</p>\n    <table>\n      <thead><tr><th>Đối thủ / rủi ro</th><th>Có thể làm</th><th>Khó sao chép</th><th>Việc Vrddi cần làm</th></tr></thead>\n      <tbody>\n        <tr><td data-label=\"Đối thủ / rủi ro\">Công nghệ nội bộ doanh nghiệp</td><td data-label=\"Có thể làm\">Ứng dụng nội bộ, bảng điều khiển riêng</td><td data-label=\"Khó sao chép\">Benchmark liên doanh nghiệp, mô hình hành vi, dữ liệu chuẩn ngành</td><td data-label=\"Việc Vrddi cần làm\">Nhanh đạt 10+ doanh nghiệp để tạo Network Effect</td></tr>\n        <tr><td data-label=\"Đối thủ / rủi ro\">Startup mới</td><td data-label=\"Có thể làm\">Ứng dụng tương tự, tích hợp lương</td><td data-label=\"Khó sao chép\">Lớp dữ liệu mạng lưới và benchmark ngành</td><td data-label=\"Việc Vrddi cần làm\">Tăng tốc lên 30+ doanh nghiệp</td></tr>\n        <tr><td data-label=\"Đối thủ / rủi ro\">Nhà cung cấp HRIS</td><td data-label=\"Có thể làm\">Tích hợp sâu dữ liệu nhân sự</td><td data-label=\"Khó sao chép\">Phân tích hành vi tài chính và giữ chân nhân sự</td><td data-label=\"Việc Vrddi cần làm\">Hợp tác trước khi họ cạnh tranh</td></tr>\n        <tr><td data-label=\"Đối thủ / rủi ro\">Nền tảng Ấn Độ bán trực tiếp</td><td data-label=\"Có thể làm\">Nền tảng lõi và bản địa hóa cơ bản</td><td data-label=\"Khó sao chép\">Quan hệ doanh nghiệp, niềm tin địa phương, playbook Việt Nam</td><td data-label=\"Việc Vrddi cần làm\">Việt Nam phải sở hữu quan hệ khách hàng doanh nghiệp</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"card span-6\">\n    <p class=\"card-title\">D. Tiến hóa mô hình giá</p>\n    <ul class=\"list-detail\"><li><strong>Giai đoạn đầu:</strong> Phần mềm theo người dùng — dễ bán, dễ thử.</li><li><strong>Giai đoạn giữa:</strong> Gói lõi + phân tích nghỉ việc, benchmark, điểm ổn định.</li><li><strong>Dài hạn:</strong> Nền tảng + lớp phân tích + benchmark giữ chân nhân sự.</li></ul>\n  </div>\n  <div class=\"card span-6\">\n    <p class=\"card-title\">E. 4 tài sản chiến lược</p>\n    <ul class=\"list-detail\"><li>Quan hệ doanh nghiệp và hợp đồng.</li><li>Bộ máy triển khai có thể lặp lại.</li><li>Dữ liệu thông minh về lực lượng lao động.</li><li>Năng lực mở rộng sang ASEAN.</li></ul>\n  </div>\n\n  <div class=\"card span-12 dark-card\">\n    <p class=\"card-title\">Điểm nhấn chiến lược</p>\n    <p class=\"quote small\">Ứng dụng có thể bị sao chép, nhưng Network Effect, benchmark ngành và niềm tin doanh nghiệp thì không.</p>\n  </div>\n</div>",en:"<div class=\"grid\">\n  <div class=\"card span-12 soft-blue\">\n    <p class=\"card-title\">🛡️ Competitive Advantage (Moat)</p>\n    <p class=\"lead\">Vrddi’s real moat is not the ability to build an app. It is behavioral data, enterprise trust, repeatable deployment capability and cross-company benchmarks.</p>\n  </div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">A. Moat layers to build</p>\n    <div class=\"ads-grid\">\n      <div class=\"hook-card\"><span class=\"hook-label\">1. Enterprise relationships</span><p class=\"desc\">C-level trust, HRD network and signed enterprise contracts.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">2. Deployment engine</span><p class=\"desc\">HR integration, industry playbooks, communication kits and go-live process.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">3. Behavioral data</span><p class=\"desc\">Participation, payout, financial-stress and attrition-correlation signals.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">4. Intelligence layer</span><p class=\"desc\">Workforce stability score, risk segmentation and retention recommendations.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">5. Cross-company benchmark</span><p class=\"desc\">Comparisons by industry, company size, tenure and workforce group.</p></div>\n      <div class=\"hook-card\"><span class=\"hook-label\">6. ASEAN expansion capability</span><p class=\"desc\">A repeatable market-entry model from Vietnam to the region.</p></div>\n    </div>\n  </div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">B. How to build the data moat</p>\n    <div class=\"loop\">\n      <div class=\"loop-item\"><b>Standardize data</b><p>Define the minimum data fields for every customer.</p></div>\n      <div class=\"loop-item\"><b>Build signal library</b><p>Signals by industry: retail, banking, BPO, healthcare.</p></div>\n      <div class=\"loop-item\"><b>Cross-company benchmark</b><p>Create benchmarks once there are 10+ enterprises.</p></div>\n      <div class=\"loop-item\"><b>Predictive models</b><p>Build stability scores by employee, team and branch.</p></div>\n      <div class=\"loop-item\"><b>Vietnam intelligence layer</b><p>India is the system of record; Vietnam builds the intelligence layer.</p></div>\n    </div>\n  </div>\n\n  <div class=\"card span-12\">\n    <p class=\"card-title\">C. Why competitors cannot copy easily</p>\n    <table>\n      <thead><tr><th>Competitor / risk</th><th>What they can build</th><th>What is hard to copy</th><th>What Vrddi must do</th></tr></thead>\n      <tbody>\n        <tr><td data-label=\"Competitor / risk\">Enterprise internal IT</td><td data-label=\"What they can build\">Internal app, custom dashboard</td><td data-label=\"What is hard to copy\">Cross-company benchmark, behavioral models, industry data</td><td data-label=\"What Vrddi must do\">Reach 10+ enterprises quickly to create the data network</td></tr>\n        <tr><td data-label=\"Competitor / risk\">New startup</td><td data-label=\"What they can build\">Similar app, payroll integration</td><td data-label=\"What is hard to copy\">Network intelligence and industry benchmarks</td><td data-label=\"What Vrddi must do\">Accelerate to 30+ enterprises</td></tr>\n        <tr><td data-label=\"Competitor / risk\">HRIS vendors</td><td data-label=\"What they can build\">Deeper HR-data integration</td><td data-label=\"What is hard to copy\">Financial-behavior and retention intelligence</td><td data-label=\"What Vrddi must do\">Partner before they compete</td></tr>\n        <tr><td data-label=\"Competitor / risk\">India platform selling directly</td><td data-label=\"What they can build\">Core platform and basic localization</td><td data-label=\"What is hard to copy\">Enterprise relationships, local trust, Vietnam playbook</td><td data-label=\"What Vrddi must do\">Vietnam must own enterprise customer relationships</td></tr>\n      </tbody>\n    </table>\n  </div>\n\n  <div class=\"card span-6\">\n    <p class=\"card-title\">D. Pricing evolution</p>\n    <ul class=\"list-detail\"><li><strong>Early stage:</strong> Per-user software — simple to pitch and trial.</li><li><strong>Mid stage:</strong> Core package + churn analytics, benchmark and stability score.</li><li><strong>Long term:</strong> Platform + intelligence layer + retention benchmarks.</li></ul>\n  </div>\n  <div class=\"card span-6\">\n    <p class=\"card-title\">E. 4 strategic assets</p>\n    <ul class=\"list-detail\"><li>Enterprise relationships and contracts.</li><li>Repeatable deployment engine.</li><li>Workforce intelligence data.</li><li>ASEAN expansion capability.</li></ul>\n  </div>\n\n  <div class=\"card span-12 dark-card\">\n    <p class=\"card-title\">Strategic highlight</p>\n    <p class=\"quote small\">An app can be copied. A data network, industry benchmarks and enterprise trust cannot be copied quickly.</p>\n  </div>\n</div>"})},

const REV_DEFAULTS={
 newEnt:[20,80,250], groups:[8,10,12], subFee:[4,4,4], setupFee:[4,4,4], groupFee:[100,100,100], analyticsFee:[0,12,12], analyticsRate:[0,20,35], policyFee:[0,150,200], policyRate:[0,25,40], benefitFee:[0,1.5,2], benefitRate:[0,15,30], integrationFee:[0,2500,3000], benchmarkFee:[0,500,800], benchmarkRate:[0,10,20], multiple:[8,10,12]
};
function initRevenueModel(){
 const root=document.querySelector('.revenue-model'); if(!root) return; const l=root.dataset.revLang||lang;
 const label=(vi,en)=>l==='vi'?vi:en;
 const groups=[
  {title:label('Quy mô khách hàng','Customer scale'), fields:[['newEnt',label('DN ký mới','New enterprises'),0,500,1,''],['groups',label('Nhóm / DN','Groups / enterprise'),1,50,1,'']]},
  {title:label('Core revenue','Core revenue'), fields:[['subFee',label('Subscription / user / tháng','Subscription / user / month'),0,20,.5,'$'],['setupFee',label('Setup / user mới','Setup / new user'),0,20,.5,'$'],['groupFee',label('Group fee / DN / năm','Group fee / enterprise / year'),0,1000,10,'$']]},
  {title:label('Add-on & upsell','Add-ons & upsell'), fields:[['analyticsFee',label('Analytics / user / năm','Analytics / user / year'),0,50,1,'$'],['analyticsRate',label('Tỷ lệ mua Analytics','Analytics adoption'),0,100,1,'%'],['policyFee',label('Policy module / DN / tháng','Policy module / enterprise / month'),0,1000,10,'$'],['policyRate',label('Tỷ lệ mua Policy','Policy adoption'),0,100,1,'%'],['benefitFee',label('Benefit wallet / user / tháng','Benefit wallet / user / month'),0,10,.1,'$'],['benefitRate',label('Tỷ lệ dùng Benefit','Benefit Wallet adoption'),0,100,1,'%']]},
  {title:label('Enterprise services','Enterprise services'), fields:[['integrationFee',label('Integration / DN mới','Integration / new enterprise'),0,10000,100,'$'],['benchmarkFee',label('Benchmark report / DN / năm','Benchmark report / enterprise / year'),0,3000,50,'$'],['benchmarkRate',label('Tỷ lệ mua Benchmark','Benchmark adoption'),0,100,1,'%'],['multiple',label('ARR Multiple','ARR Multiple'),1,20,.5,'x']]}
 ];
 const controls=document.getElementById('revControls');
 controls.innerHTML=groups.map(g=>`<div class="rev-control-card"><p class="rev-control-title">${g.title}</p>${g.fields.map(f=>revField(f,l)).join('')}</div>`).join('');
 document.querySelectorAll('[data-rev-input]').forEach(inp=>{inp.addEventListener('input',syncRevenueInputs);});

function revField(f,l){
 const [key,title,min,max,step,suffix]=f; const years=l==='vi'?['Năm 1','Năm 2','Năm 3']:['Year 1','Year 2','Year 3'];
 return `<div class="rev-field"><label><span>${title}</span></label><div class="rev-year-grid">${[0,1,2].map(i=>{const v=REV_DEFAULTS[key][i];return `<div><label><span>${years[i]}</span></label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-rev-input="${key}" data-year="${i}" data-kind="range"><div class="rev-number"><input type="number" min="${min}" max="${max}" step="${step}" value="${v}" data-rev-input="${key}" data-year="${i}" data-kind="number"><span>${suffix}</span></div></div>`}).join('')}</div></div>`;
}
function syncRevenueInputs(e){
 if(e){const key=e.target.dataset.revInput, y=e.target.dataset.year, v=e.target.value; document.querySelectorAll(`[data-rev-input="${key}"][data-year="${y}"]`).forEach(el=>{if(el!==e.target)el.value=v;});}
 updateRevenueModel();
}
function revVal(key,i){const el=document.querySelector(`[data-rev-input="${key}"][data-year="${i}"][data-kind="number"]`); return el?parseFloat(el.value||0):0;}
function money(n){if(!isFinite(n))return '—'; const abs=Math.abs(n); if(abs>=1000000)return '$'+(n/1000000).toFixed(2)+'M'; if(abs>=1000)return '$'+(n/1000).toFixed(1)+'K'; return '$'+Math.round(n).toLocaleString('en-US');}
function num(n){return Math.round(n).toLocaleString('en-US')}
function pct(n){return isFinite(n)?(n*100).toFixed(0)+'%':'—'}
function updateRevenueModel(){
 const root=document.querySelector('.revenue-model'); if(!root) return; const l=root.dataset.revLang||lang; const y=[0,1,2];
 const t=l==='vi'?{stream:'Dòng doanh thu',y1:'Năm 1',y2:'Năm 2',y3:'Năm 3',subscription:'Subscription ARR',group:'Group fee ARR',analytics:'Analytics ARR',policy:'Policy Module ARR',benefit:'Benefit Wallet ARR',benchmark:'Benchmarking ARR',setup:'Setup fee',integration:'Integration fee',totalArr:'Tổng ARR',oneTime:'Tổng one-time',totalRev:'Tổng doanh thu',paidUsers:'Paid users tích lũy',cumEnt:'Doanh nghiệp tích lũy',arrUser:'ARR / Paid user',growth:'Tăng trưởng ARR',valuation:'Định giá ước tính',ok:'✅ ĐẠT - Định giá ≥ $30M',no:'❌ CHƯA ĐẠT - tăng paid users, adoption hoặc pricing',target:'Mục tiêu định giá $30M'}:{stream:'Revenue stream',y1:'Year 1',y2:'Year 2',y3:'Year 3',subscription:'Subscription ARR',group:'Group fee ARR',analytics:'Analytics ARR',policy:'Policy Module ARR',benefit:'Benefit Wallet ARR',benchmark:'Benchmarking ARR',setup:'Setup fee',integration:'Integration fee',totalArr:'Total ARR',oneTime:'Total one-time',totalRev:'Gross revenue',paidUsers:'Cumulative paid users',cumEnt:'Cumulative enterprises',arrUser:'ARR / paid user',growth:'ARR YoY growth',valuation:'Estimated valuation',ok:'✅ ACHIEVED - valuation ≥ $30M',no:'❌ NOT YET - increase paid users, adoption or pricing',target:'$30M valuation target'};
 const m={}; ['newEnt','groups','subFee','setupFee','groupFee','analyticsFee','analyticsRate','policyFee','policyRate','benefitFee','benefitRate','integrationFee','benchmarkFee','benchmarkRate','multiple'].forEach(k=>m[k]=y.map(i=>revVal(k,i)));
 const r={cumEnt:[],usersPerCompany:[],paidUsers:[],newUsers:[],subArr:[],setup:[],groupArr:[],analyticsArr:[],policyArr:[],benefitArr:[],integration:[],benchmarkArr:[],totalArr:[],oneTime:[],totalRev:[],valuation:[],arrUser:[],growth:[]};
 y.forEach(i=>{r.cumEnt[i]=m.newEnt.slice(0,i+1).reduce((a,b)=>a+b,0); r.usersPerCompany[i]=m.groups[i]*12; r.paidUsers[i]=r.cumEnt[i]*r.usersPerCompany[i]; r.newUsers[i]=m.newEnt[i]*r.usersPerCompany[i]; r.subArr[i]=r.paidUsers[i]*m.subFee[i]*12; r.setup[i]=r.newUsers[i]*m.setupFee[i]; r.groupArr[i]=r.cumEnt[i]*m.groupFee[i]; r.analyticsArr[i]=r.cumEnt[i]*(m.analyticsRate[i]/100)*r.usersPerCompany[i]*m.analyticsFee[i]; r.policyArr[i]=r.cumEnt[i]*(m.policyRate[i]/100)*m.policyFee[i]*12; r.benefitArr[i]=r.cumEnt[i]*(m.benefitRate[i]/100)*r.usersPerCompany[i]*m.benefitFee[i]*12; r.integration[i]=m.newEnt[i]*m.integrationFee[i]; r.benchmarkArr[i]=r.cumEnt[i]*(m.benchmarkRate[i]/100)*m.benchmarkFee[i]; r.totalArr[i]=r.subArr[i]+r.groupArr[i]+r.analyticsArr[i]+r.policyArr[i]+r.benefitArr[i]+r.benchmarkArr[i]; r.oneTime[i]=r.setup[i]+r.integration[i]; r.totalRev[i]=r.totalArr[i]+r.oneTime[i]; r.valuation[i]=r.totalArr[i]*m.multiple[i]; r.arrUser[i]=r.paidUsers[i]?r.totalArr[i]/r.paidUsers[i]:0; r.growth[i]=i===0?null:(r.totalArr[i-1]?((r.totalArr[i]-r.totalArr[i-1])/r.totalArr[i-1]):null);});
 document.getElementById('revKpiArr').textContent=money(r.totalArr[2]); document.getElementById('revKpiValuation').textContent=money(r.valuation[2]); document.getElementById('revKpiRevenue').textContent=money(r.totalRev[2]); document.getElementById('revKpiUsers').textContent=num(r.paidUsers[2]); document.getElementById('revKpiTarget').textContent=r.valuation[2]>=30000000?t.ok:t.no; document.getElementById('revTargetInsight').textContent=`${t.target}: ${r.valuation[2]>=30000000?t.ok:t.no}. ${t.totalArr}: ${money(r.totalArr[2])}. ${t.valuation}: ${money(r.valuation[2])}.`;
 const row=(name,arr,cls='')=>`<tr class="${cls}"><td data-label="${t.stream}">${name}</td>${arr.map((v,i)=>`<td data-label="${[t.y1,t.y2,t.y3][i]}" class="right">${money(v)}</td>`).join('')}</tr>`;
 document.getElementById('revStreamTable').innerHTML=`<thead><tr><th>${t.stream}</th><th class="right">${t.y1}</th><th class="right">${t.y2}</th><th class="right">${t.y3}</th></tr></thead><tbody>${row(t.subscription,r.subArr)}${row(t.group,r.groupArr)}${row(t.analytics,r.analyticsArr)}${row(t.policy,r.policyArr)}${row(t.benefit,r.benefitArr)}${row(t.benchmark,r.benchmarkArr)}${row(t.totalArr,r.totalArr,'highlight-row')}${row(t.setup,r.setup)}${row(t.integration,r.integration)}${row(t.oneTime,r.oneTime,'strong-row')}${row(t.totalRev,r.totalRev,'highlight-row')}</tbody>`;
 const krow=(name,vals,fmt='money',cls='')=>`<tr class="${cls}"><td data-label="${t.stream}">${name}</td>${vals.map((v,i)=>`<td data-label="${[t.y1,t.y2,t.y3][i]}" class="right">${fmt==='num'?num(v):fmt==='pct'?(v===null?'—':pct(v)):money(v)}</td>`).join('')}</tr>`;
 document.getElementById('revKpiTable').innerHTML=`<thead><tr><th>${t.stream}</th><th class="right">${t.y1}</th><th class="right">${t.y2}</th><th class="right">${t.y3}</th></tr></thead><tbody>${krow(t.cumEnt,r.cumEnt,'num')}${krow(t.paidUsers,r.paidUsers,'num')}${krow(t.arrUser,r.arrUser)}${krow(t.growth,r.growth,'pct')}${krow(t.valuation,r.valuation,'money','highlight-row')}</tbody>`;
}
let lang='en'; let active=0;
const nav=document.getElementById('nav'), content=document.getElementById('content'), sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay');
function renderShell(){
 document.documentElement.lang=lang;
 document.getElementById('brandSub').textContent=I18N[lang].brandSub;
 document.getElementById('menuLabel').textContent=I18N[lang].menu;
 nav.innerHTML=I18N[lang].nav.map((n,i)=>`<button type="button" class="${i===active?'active':''}" onclick="setTab(${i})"><span class="nav-num">${String(i+1).padStart(2,'0')}</span><span>${n}</span></button>`).join('');
 updateLangButtons();
 setTab(active,false);
}
function setTab(i, close=true){
 active=i;
 [...nav.children].forEach((b,idx)=>b.classList.toggle('active',idx===i));
 document.getElementById('pageNum').textContent=String(i+1).padStart(2,'0');
 document.getElementById('pageTitle').textContent=I18N[lang].nav[i];
 document.getElementById('pageSub').textContent=I18N[lang].sub[i];
 content.classList.remove('active');
 const html=TABS[i].render()[lang];
 setTimeout(()=>{content.innerHTML=html;content.classList.add('active');if(i===14)initRevenueModel();window.scrollTo({top:0,behavior:'smooth'});},60);
 if(close && window.innerWidth<=1120) closeMenu();
}
function updateLangButtons(){
 ['top-en','side-en'].forEach(id=>document.getElementById(id).classList.toggle('active',lang==='en'));
 ['top-vi','side-vi'].forEach(id=>document.getElementById(id).classList.toggle('active',lang==='vi'));
}
function setLang(l){lang=l;renderShell();}
function openMenu(){sidebar.classList.add('open');overlay.classList.add('open')}
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('open')}
document.getElementById('menuBtn').addEventListener('click',openMenu);
overlay.addEventListener('click',closeMenu);
document.getElementById('top-en').addEventListener('click',()=>setLang('en'));
document.getElementById('top-vi').addEventListener('click',()=>setLang('vi'));
document.getElementById('side-en').addEventListener('click',()=>setLang('en'));
document.getElementById('side-vi').addEventListener('click',()=>setLang('vi'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
renderShell();
</script>
