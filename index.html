function arch(lang){
 const yes=lang==='vi'?'Có':'Yes', no=lang==='vi'?'Không':'No';
 const labels=lang==='vi'?['Thành phần','India Core','VN Local','Ghi chú']:['Component','India Core','VN Local','Note'];
 const rows1=lang==='vi' ? [['🔐 Xác thực & Bảo mật',yes,no,'Nền tảng "hệ điều hành" của toàn platform'],['💼 Wallet Engine',yes,no,'Quản lý ví điện tử nhân viên'],['💳 Transaction Engine',yes,no,'Xử lý toàn bộ giao dịch tài chính'],['📊 Fund Allocation / Vesting Engine',yes,no,'Phân bổ & lập lịch giải ngân tự động'],['🔌 API Gateway',yes,no,'Cổng kết nối tất cả module'],['📋 Audit Log / Analytics Infra',yes,no,'Nhật ký kiểm toán & hạ tầng phân tích dữ liệu'],['🔔 Notification Infra',yes,no,'Hạ tầng thông báo đa kênh']] : [['🔐 Authentication & Security',yes,no,'The operating foundation of the full platform'],['💼 Wallet Engine',yes,no,'Manages employee e-wallet logic'],['💳 Transaction Engine',yes,no,'Processes all financial transactions'],['📊 Fund Allocation / Vesting Engine',yes,no,'Automated allocation and payout scheduling'],['🔌 API Gateway',yes,no,'Gateway connecting all modules'],['📋 Audit Log / Analytics Infra',yes,no,'Audit trail and data analytics infrastructure'],['🔔 Notification Infra',yes,no,'Multi-channel notification infrastructure']];
 const rows2=lang==='vi' ? [['🔗 HR Connectors',no,yes,'SAP, Odoo, MISA, Base HRM, Fast, Bravo, Workday…'],['⚙️ Enterprise Policy Engine',no,yes,'Vesting · Retention · Điều kiện tham gia. Vrddi VN phải chủ sở hữu hoàn toàn module này'],['⚖️ Tuân thủ pháp lý VN',no,yes,'PDPA VN · Luật Lao động · Luồng đồng ý'],['📱 Giao diện Việt Nam',no,yes,'App Nhân viên + HR Dashboard. Ưu tiên xây dựng niềm tin: dùng “quyền lợi”, “phúc lợi” thay vì “wallet”']] : [['🔗 HR Connectors',no,yes,'SAP, Odoo, MISA, Base HRM, Fast, Bravo, Workday…'],['⚙️ Enterprise Policy Engine',no,yes,'Vesting · Retention · Eligibility. Vrddi VN must fully own this module'],['⚖️ Vietnam legal compliance',no,yes,'Vietnam PDPA · Labor Code · Consent flows'],['📱 Vietnam interface',no,yes,'Employee App + HR Dashboard. Prioritize trust-building language: use “benefits” and “wellbeing” instead of “wallet”']];
 const rows3=lang==='vi' ? [['🚀 Triển khai & Onboarding Doanh nghiệp',no,yes,'Đây là nơi doanh nghiệp trả tiền — trực tiếp tạo ra doanh thu'],['🔧 Hỗ trợ Tích hợp & Luồng nghiệp vụ tùy chỉnh',no,yes,'Tùy biến quy trình theo yêu cầu đặc thù của từng khách hàng doanh nghiệp'],['📈 Báo cáo / Đo lường hiệu quả / Tối ưu Pilot',no,yes,'Cung cấp số liệu minh chứng ROI, hỗ trợ mở rộng sau pilot']] : [['🚀 Enterprise deployment & onboarding',no,yes,'This is where enterprises pay — directly creating revenue'],['🔧 Integration support & custom workflows',no,yes,'Customize workflows for each enterprise customer’s specific requirements'],['📈 Reporting / Impact measurement / Pilot optimization',no,yes,'Provide ROI evidence and support expansion after pilot']];
 return `<div class="card span-12"><div class="arch">${archSection(lang==='vi'?'🔵 Layer 1 — Hạ tầng lõi (Ấn Độ) | Mục tiêu: Ổn định · Bảo mật · Có khả năng mở rộng':'🔵 Layer 1 — Core Infrastructure (India) | Goal: Stability · Security · Scalability','blue',labels,rows1,lang)}${archSection(lang==='vi'?'🔵 Layer 2 — Bản địa hóa (Việt Nam) | Mục tiêu: Phù hợp thị trường & Tuân thủ pháp lý':'🔵 Layer 2 — Localization (Vietnam) | Goal: Market fit & legal compliance','blue',labels,rows2,lang)}${archSection(lang==='vi'?'🟠 Layer 3 — Giải pháp Doanh nghiệp (Việt Nam) | Mục tiêu: Tạo doanh thu':'🟠 Layer 3 — Enterprise Solutions (Vietnam) | Goal: Revenue creation','amber',labels,rows3,lang)}</div></div>`;
}
function archSection(title, tone, labels, rows, lang){
 return `<div class="arch-section"><div class="arch-head ${tone}">${title}</div><div class="arch-grid header"><div class="arch-cell">${labels[0]}</div><div class="arch-cell">${labels[1]}</div><div class="arch-cell">${labels[2]}</div><div class="arch-cell">${labels[3]}</div></div>${rows.map(r=>`<div class="arch-grid"><div class="arch-cell" data-label="${labels[0]}"><strong>${r[0]}</strong></div><div class="arch-cell" data-label="${labels[1]}"><span class="badge ${/Yes|Có/.test(r[1])?'yes':'no'}">${r[1]}</span></div><div class="arch-cell" data-label="${labels[2]}"><span class="badge ${/Yes|Có/.test(r[2])?'yes':'no'}">${r[2]}</span></div><div class="arch-cell" data-label="${labels[3]}">${r[3]}</div></div>`).join('')}</div>`;
}
let lang='en'; let active=0;
const nav=document.getElementById('nav'), content=document.getElementById('content'), sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay');
function renderShell(){
 document.documentElement.lang=lang;
 document.getElementById('brandSub').textContent=I18N[lang].brandSub;
 document.getElementById('menuLabel').textContent=I18N[lang].menu;
 nav.innerHTML=I18N[lang].nav.map((n,i)=>`<button type="button" class="${i===active?'active':''}" onclick="setTab(${i})"><span class="nav-num">${String(i+1).padStart(2,'0')}</span><span>${n}</span></button>`).join('');
 updateLangButtons();
 setTab(active,false);
}
function setTab(i, close=true){
 active=i;
 [...nav.children].forEach((b,idx)=>b.classList.toggle('active',idx===i));
 document.getElementById('pageNum').textContent=String(i+1).padStart(2,'0');
 document.getElementById('pageTitle').textContent=I18N[lang].nav[i];
 document.getElementById('pageSub').textContent=I18N[lang].sub[i];
 content.classList.remove('active');
 const html=TABS[i].render()[lang];
 setTimeout(()=>{content.innerHTML=html;content.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});},60);
 if(close && window.innerWidth<=1120) closeMenu();
}
function updateLangButtons(){
 ['top-en','side-en'].forEach(id=>document.getElementById(id).classList.toggle('active',lang==='en'));
 ['top-vi','side-vi'].forEach(id=>document.getElementById(id).classList.toggle('active',lang==='vi'));
}
function setLang(l){lang=l;renderShell();}
function openMenu(){sidebar.classList.add('open');overlay.classList.add('open')}
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('open')}
document.getElementById('menuBtn').addEventListener('click',openMenu);
overlay.addEventListener('click',closeMenu);
document.getElementById('top-en').addEventListener('click',()=>setLang('en'));
document.getElementById('top-vi').addEventListener('click',()=>setLang('vi'));
document.getElementById('side-en').addEventListener('click',()=>setLang('en'));
document.getElementById('side-vi').addEventListener('click',()=>setLang('vi'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
renderShell();
</script>
